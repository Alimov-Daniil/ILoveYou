<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Кохання — Неоновий слід</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Верхня панель зі слотами для зібраних букв -->
    <div id="phrase-container">
        <div class="word">
            <span class="letter-slot" id="slot-0">к</span>
            <span class="letter-slot" id="slot-1">а</span>
            <span class="letter-slot" id="slot-2">т</span>
            <span class="letter-slot" id="slot-3">я</span>
        </div>
        <div class="word">
            <span class="letter-slot" id="slot-4">я</span>
        </div>
        <div class="word">
            <span class="letter-slot" id="slot-5">т</span>
            <span class="letter-slot" id="slot-6">е</span>
            <span class="letter-slot" id="slot-7">б</span>
            <span class="letter-slot" id="slot-8">е</span>
        </div>
        <div class="word">
            <span class="letter-slot" id="slot-9">к</span>
            <span class="letter-slot" id="slot-10">о</span>
            <span class="letter-slot" id="slot-11">х</span>
            <span class="letter-slot" id="slot-12">а</span>
            <span class="letter-slot" id="slot-13">ю</span>
        </div>
    </div>
    <div id="hint">Проведіть пальцем по екрану ✨</div>
    <canvas id="canvas"></canvas>

    <script src="js/skript.js"></script>
</body>
</html>
